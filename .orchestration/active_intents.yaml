INT-001:
  title: Build Weather API
  description: Add a /forecast endpoint and unit tests.
  owned_scope:
    - src/weather/**
  constraints:
    - No external HTTP calls in tests
    - Keep changes inside owned_scope

INT-002:
  title: Refactor Trace Writer
  description: Improve trace writer performance without schema change.
  owned_scope:
    - src/utils/**
    - src/core/task/**
  constraints:
    - Keep JSONL schema backward compatible

INT-003:
  title: Agent Trace ledger Phase 3
  description: Append deterministic mutation ledger records for successful write-like tool calls.
  owned_scope:
    - src/core/hooks/**
    - src/core/task/**
    - src/core/tools/**
    - src/core/intents/**
    - .orchestration/**
  constraints:
    - No breaking changes to existing tests.
    - Keep hooks deterministic.
    - Append-only agent_trace.jsonl, one JSON object per line.
